name: "🧪 Tests & ✨ Lint"

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  build:
    name: Build and Test Label
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install Dependencies
        run: npm i

      - name: Build and Compile
        run: npm run compile

      - name: Run Tests
        run: npm run test

      - name: Run Lint
        run: npm run lint

      - name: Run format
        run: npm run format
